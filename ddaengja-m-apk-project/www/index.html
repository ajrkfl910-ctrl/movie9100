<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090b10">
<title>땡자 M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: dark-fantasy MMORPG shell. Full-bleed canvas field, HUD layered on top, menus as centered bronze-framed sheets. */
:root{
 --bg:#090b10;--panel:#12161f;--panel2:#1a2030;--line:#4a3e2a;--line2:#2a2f3c;
 --gold:#d9b45f;--gold2:#f4dc92;--text:#e9e5d8;--mute:#8d8c88;
 --hp:#c23a33;--mp:#2f72d6;--good:#59c47a;--bad:#e0584f;
 --g0:#b9b7b0;--g1:#62d26f;--g2:#4aa8ff;--g3:#b673ff;--g4:#ffb12e;--g5:#ff4f64;
 --f-d:'Black Han Sans','Noto Sans KR','Malgun Gothic',sans-serif;
 --f-b:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
 color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--f-b);overflow:hidden;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
input,select{user-select:text;-webkit-user-select:text;font:inherit;color:var(--text);background:#0c0f16;border:1px solid var(--line2);border-radius:4px;padding:9px 10px;min-width:0;width:100%}
button{font:inherit;color:inherit;cursor:pointer}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
#bgfx{position:fixed;inset:0;z-index:0;background-size:cover!important;background-position:center bottom!important;background:radial-gradient(ellipse at 50% 0%,#2a2216 0,transparent 55%),radial-gradient(ellipse at 15% 100%,#14203a 0,transparent 50%),repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 2px,transparent 2px 14px),var(--bg)}
.scr{position:relative;z-index:1;height:100%;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding-block:20px}
.card{margin:auto;width:min(440px,100%);background:linear-gradient(var(--panel),#0f131b);border:1px solid var(--line);border-radius:6px;padding:20px;box-shadow:0 0 0 1px #000,0 18px 50px rgba(0,0,0,.6)}
.card.wide{width:min(720px,100%)}
.logo{font:400 clamp(44px,12vw,68px)/1 var(--f-d);letter-spacing:.04em;color:var(--gold2);text-align:center;text-shadow:0 2px 0 #5a4520,0 0 24px rgba(217,180,95,.35)}
.logo i{font-style:normal;color:#e65a4f;text-shadow:0 2px 0 #4a1410}
.sub{text-align:center;color:var(--mute);font-size:12px;letter-spacing:.18em;margin:6px 0 18px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 14px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--gold2);border-color:var(--gold)}
.f{display:grid;gap:5px;margin-top:12px}
.f label{font-size:12px;color:var(--mute);letter-spacing:.04em}
.err{color:var(--bad);min-height:20px;font-size:13px;margin-top:10px}
.hint{margin-top:16px;border:1px dashed var(--line2);border-radius:4px;padding:10px 12px;color:var(--mute);font-size:12px}
.hint b{color:var(--gold2);font-weight:500}
.btn{background:linear-gradient(#3a2f1c,#241c10);border:1px solid var(--gold);color:var(--gold2);padding:9px 14px;border-radius:4px}
.btn:hover{filter:brightness(1.2)}
.btn.sec{border-color:var(--line2);background:var(--panel2);color:var(--text)}
.btn.red{border-color:var(--bad);background:#3a1614;color:#ffb0aa}
.btn.big{width:100%;padding:12px;margin-top:6px;font-size:15px}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hd h2{margin:0;font:400 22px var(--f-d);color:var(--gold2)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:3px;border:1px solid var(--line2);color:var(--mute);margin-left:6px;vertical-align:middle}
.badge.gm{color:#1a1204;background:var(--gold);border-color:var(--gold);font-weight:700}
.slots{display:grid;gap:10px;margin-top:14px}
.slot{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line2);border-radius:5px;background:var(--panel2)}
.sw{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid #000;box-shadow:0 0 0 1px var(--line)}
.slot .m{flex:1;min-width:0}.slot .m b{display:block;font-weight:500}.slot .m small{color:var(--mute)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}
.cc{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:9px}
.cc.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cc small{color:var(--mute);font-size:11px;line-height:1.3}
.cc .sw{width:20px;height:20px}
.cc div{display:flex;align-items:center;gap:7px}
/* game */
#scr-game{position:fixed;inset:0;z-index:5;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto;position:absolute}
.tl{left:max(16px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px))}
#h-me{width:min(210px,52vw);background:rgba(10,12,18,.72);border:1px solid var(--line);border-radius:5px;padding:6px 8px;display:grid;gap:4px}
#me-n{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#me-s{font-size:11px;color:var(--mute)}
.gmtag{color:#1a1204;background:var(--gold);border-radius:3px;padding:0 4px;font-size:10px;margin-right:4px}
.bar{position:relative;height:15px;background:#07090d;border:1px solid #000;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(217,180,95,.3)}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .12s}
.bar span{position:relative;z-index:1;display:block;text-align:center;font-size:10px;line-height:15px;text-shadow:0 1px 1px #000;font-variant-numeric:tabular-nums}
.hp i{background:linear-gradient(#e0554d,#8e2420)}.mp i{background:linear-gradient(#4a8cf0,#1d4a96)}
.xp{height:6px}.xp i{background:linear-gradient(#e8c458,#9a7a22)}
#h-tg{left:max(16px,env(safe-area-inset-left,0px));top:calc(196px + env(safe-area-inset-top,0px));width:min(210px,52vw);background:rgba(10,12,18,.72);border:1px solid #6a2a26;border-radius:5px;padding:5px 8px;display:grid;gap:3px;font-size:12px}
#h-rd{right:max(16px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:grid;gap:6px;justify-items:end}
#rd{width:104px;height:104px;cursor:crosshair;touch-action:none;border-radius:50%;border:2px solid var(--line);background:#000}
#rd-z{font-size:11px;color:var(--gold2);text-shadow:0 1px 2px #000;max-width:120px;text-align:right}
.rb{display:flex;gap:5px}
#log{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 32px));pointer-events:none!important}
#log div{font-size:12px;text-shadow:0 1px 2px #000;background:rgba(0,0,0,.38);padding:1px 6px;margin-top:2px;border-radius:2px;width:fit-content;max-width:100%}
#log .ann{color:var(--gold2);background:rgba(60,40,0,.6)}
#joy{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05);border:2px solid rgba(217,180,95,.35);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:radial-gradient(#d9b45f,#6b5420);pointer-events:none}
#ctl{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;justify-items:end}
.r3{display:flex;gap:6px}
.gb.uq{box-shadow:0 0 0 2px #000,0 0 12px currentColor,inset 0 0 12px rgba(255,177,46,.45);animation:uqg 2s ease-in-out infinite}@keyframes uqg{50%{filter:brightness(1.35)}}
.sk{display:grid;grid-template-columns:repeat(3,46px);gap:6px}
.gb{width:46px;height:46px;border-radius:50%;background:radial-gradient(#2b2f3b,#12151c);border:2px solid var(--line);color:var(--gold2);font-size:12px;position:relative;overflow:hidden;padding:0;touch-action:none;line-height:1.1}
.gb small{display:block;font-size:9px;color:var(--mute)}
.gb.on{border-color:var(--good);color:#b6ffcb}
.gb.lock{opacity:.35}
.cdv{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);height:0;pointer-events:none}
#atk{width:74px;height:74px;font-size:15px;border-color:var(--gold);background:radial-gradient(#5a3a1c,#1c1208)}
#toast{left:50%;top:calc(230px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(10,12,18,.9);border:1px solid var(--gold);color:var(--gold2);padding:6px 14px;border-radius:4px;font-size:13px;pointer-events:none!important;opacity:0;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
#dead{position:absolute;inset:0;z-index:15;background:rgba(60,0,0,.6);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center}
#dead h2{font:400 40px var(--f-d);color:#ff9088;margin:0}
/* windows */
#win{position:fixed;inset:0;z-index:20;background:rgba(3,4,8,.72);display:flex;align-items:center;justify-content:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.wbox{width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 0 0 1px #000,0 20px 60px #000}
.wh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.wh h3{margin:0;font:400 20px var(--f-d);color:var(--gold2)}
.x{background:none;border:0;font-size:26px;line-height:1;color:var(--mute);padding:0 6px}
.wb{overflow:auto;padding:12px 14px;min-height:120px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.mgrid button{padding:16px 6px;background:var(--panel2);border:1px solid var(--line2);border-radius:5px}
.mgrid button:hover{border-color:var(--gold)}
.row{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line2)}
.row.sel{background:rgba(217,180,95,.08)}
.wal{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px;padding:6px 10px;border-radius:20px;background:linear-gradient(90deg,#0d1119,#1a2030);border:1px solid var(--line2)}
.wc{font-size:14px;font-variant-numeric:tabular-nums;padding:2px 12px;border-radius:14px;background:rgba(255,255,255,.05)}.wc i{font-style:normal;margin-right:6px}.wc .d{color:#7fd8ff}.wc .g{color:#ffd34d}.wc.lv{margin-left:auto;color:var(--mute);font-size:12px}
.shg{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:10px}
.shc{border:1px solid #5a4c2c;background:linear-gradient(#0c1018,#141a28);border-radius:3px;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px #000,inset 0 0 18px rgba(217,180,95,.08)}
.sh-h{text-align:center;font-size:13px;padding:6px 4px;border-bottom:1px solid #3a3320;background:rgba(0,0,0,.35);color:#e6e0d0}
.sh-a{position:relative;height:110px;display:grid;place-items:center;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--gc) 35%,transparent),transparent 70%)}
.sh-card{width:56px;height:76px;border-radius:6px;border:2px solid #b99b5a;background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 85%,#fff 0%),#3a0f10);display:grid;place-items:center;box-shadow:0 4px 10px #000,inset 0 0 10px rgba(0,0,0,.5);position:relative}
.sh-card span{font:400 26px var(--f-d);color:#fff;text-shadow:0 0 8px #fff8}
.sh-card.st{box-shadow:6px 3px 0 -1px #5a2a22,12px 6px 0 -2px #3c1c18,0 4px 10px #000}
.sh-b{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;background:rgba(10,50,40,.85);border:1px solid #2a6a58;color:#6fe3b8;font-size:12px;display:grid;place-items:center}
.sh-s{position:absolute;left:6px;right:6px;bottom:3px;text-align:center;font-size:10px;color:var(--mute);line-height:1.25}
.sh-p{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-top:1px solid #3a3320;background:rgba(0,0,0,.3)}.dm{color:#e8f4ff;font-weight:500}
.bagbar{display:flex;gap:6px;align-items:center;margin:8px 0}.bagbar input{flex:1;min-width:0;padding:8px 10px;border-radius:4px;background:#0c1018;border:1px solid var(--line2);color:var(--ink)}
.bagbar button{padding:7px 10px;border-radius:4px;border:1px solid var(--line2);background:#141a26;color:var(--mute);font-size:12px}.bagbar button.on{color:var(--gold2);border-color:var(--gold);background:#1e2230}
.bagg{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;padding:8px;background:#06080d;border:1px solid var(--line);border-radius:4px;max-height:46vh;overflow:auto}
.slot2{position:relative;aspect-ratio:1;border:2px solid var(--gc,#333);border-radius:3px;background:radial-gradient(circle at 50% 40%,#161a24,#05070b);padding:0;overflow:hidden;box-shadow:inset 0 0 10px rgba(0,0,0,.7)}
.slot2.hi{box-shadow:inset 0 0 12px color-mix(in srgb,var(--gc) 45%,transparent),0 0 6px color-mix(in srgb,var(--gc) 60%,transparent)}
.slot2.sel{outline:2px solid #ff6a4a;box-shadow:0 0 12px #ff6a4a}.slot2.e{border-color:#1c2030;background:#080a10;box-shadow:none}
.slot2 img{width:100%;height:100%;object-fit:contain;display:block}.slot2 i{position:absolute;right:3px;bottom:1px;font:700 12px var(--f-b);font-style:normal;text-shadow:0 0 3px #000,0 0 3px #000}.slot2 .enh{color:#4aa8ff}.slot2 .cnt{color:#ffd34d}
.bagft{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:13px;gap:8px}.gcoin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#d9a020);margin-right:6px;vertical-align:-2px}
.bagdet{border:1px solid var(--line2);border-radius:4px;background:#0c1018;padding:2px 6px}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stc{border:1px solid var(--line2);border-radius:4px;padding:8px;background:linear-gradient(#0e1320,#0a0d16)}.stc.main{border-color:var(--gold);box-shadow:inset 0 0 14px rgba(217,180,95,.14)}
.stn{display:flex;justify-content:space-between;align-items:baseline;font-style:italic}.stn b{font:700 18px var(--f-b);letter-spacing:.04em}.stn span{font:500 22px var(--f-b);font-style:normal}.stc small{display:block;margin:2px 0 6px;color:var(--mute);font-size:11px}
.stx{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;background:#0a0d14;border:1px solid var(--line);padding:8px 10px;border-radius:4px}.stx div{display:flex;justify-content:space-between;font-size:12.5px}.stx i{font-style:normal;color:var(--mute)}
.atgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.atstr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.atc{position:relative;min-height:74px;border:1px solid #4a3c22;border-radius:3px;background:linear-gradient(#130f0a,#0a0806);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px 2px 3px;overflow:hidden}
.atc .atn{position:absolute;left:4px;top:1px;font:italic 600 13px var(--f-b);color:#c9a24e}.atc img{width:30px;height:30px}.atc small{font-size:9.5px;color:var(--mute);text-align:center;line-height:1.2}
.atc.wk{border-color:var(--gold);box-shadow:inset 0 0 12px rgba(217,180,95,.25)}.atc.today{border-color:#ff8a3a;box-shadow:0 0 10px rgba(255,138,58,.6)}.atc.miss{opacity:.45}
.atc.got>*:not(.atok):not(.atn){opacity:.35}.atok{position:absolute;inset:auto 0 18px 0;text-align:center;font:italic 700 12px var(--f-b);color:#e8a640;text-shadow:0 0 6px #7a3a08,0 1px 2px #000;transform:rotate(-12deg)}
.atc .btn{font-size:11px;padding:2px 6px}.atd{font:700 13px var(--f-b);color:#7fd8ff}.atg2{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#d9a020)}
.atstr .atc{min-height:92px;padding-top:18px}.atstr .atc small{font-size:10px;margin-bottom:3px}
@media(max-width:560px){.atgrid{gap:3px}.atc{min-height:62px}.atc img{width:24px;height:24px}.atc small{font-size:8.5px}}
.eqwrap{display:grid;grid-template-columns:78px 1fr 78px;gap:8px;align-items:start;padding:10px 6px;background:radial-gradient(circle at 50% 40%,#2a1d0c,#0a0806 70%);border:1px solid var(--line);border-radius:4px}
.eqcol{display:grid;gap:8px}.eqmid{text-align:center;min-width:0}.eqmid canvas{width:100%;max-width:240px;height:auto;aspect-ratio:240/340;display:block;margin:0 auto}.eqnm b{display:block}.eqnm small{color:var(--mute)}
.eqs{position:relative;aspect-ratio:1;border:2px solid var(--gc);border-radius:3px;background:radial-gradient(circle at 50% 40%,#161a24,#05070b);padding:0;overflow:hidden;box-shadow:inset 0 0 10px rgba(0,0,0,.7)}
.eqs.hi{box-shadow:inset 0 0 12px color-mix(in srgb,var(--gc) 45%,transparent),0 0 6px color-mix(in srgb,var(--gc) 60%,transparent)}.eqs.sel{outline:2px solid #ff6a4a}.eqs.e{border-color:#2a2d38;border-style:dashed}
.eqs img{width:100%;height:100%;object-fit:contain;display:block}.eqs span{font-size:11px;color:var(--mute)}.eqs i{position:absolute;right:3px;bottom:1px;font:700 13px var(--f-b);font-style:normal;color:#4aa8ff;text-shadow:0 0 3px #000,0 0 3px #000}
.eqsets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.eqset{padding:10px 4px;border-radius:3px;border:1px solid #2a4a7a;background:linear-gradient(#1f3a5c,#142640);color:#cfe3ff;font-weight:600}.eqset.on{border-color:var(--gold)}.eqset i{display:inline-block;width:10px;height:10px;margin-right:8px;background:#666;border-radius:2px;vertical-align:-1px}.eqset.on i,.eqset i.sv{background:var(--gold)}
.mini{width:34px;height:34px;image-rendering:auto}.minis{display:flex;gap:2px;margin-top:3px}.minis .mini{width:24px;height:24px}
.ic{flex:none;width:40px;height:40px;border:2px solid var(--gc,var(--line2));border-radius:4px;background:#0b0e14;display:grid;place-items:center;font-size:11px;color:var(--gc,var(--mute));text-align:center;line-height:1.1}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:500;overflow-wrap:anywhere}
.meta small{color:var(--mute);display:block;font-size:12px;overflow-wrap:anywhere}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sec-t{margin:14px 0 4px;font-size:12px;color:var(--gold);letter-spacing:.08em}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:10px 0}
.kv div{background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:6px 9px;font-size:12px;color:var(--mute)}
.kv b{display:block;color:var(--text);font-size:14px;font-weight:500}
.ok{color:var(--good)}.bad{color:var(--bad)}.gold{color:var(--gold2)}.mute{color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.note{color:var(--mute);font-size:12px;margin:8px 0}
.enhbox{margin-top:10px;border:1px solid var(--line);border-radius:5px;padding:12px;background:var(--panel2)}
.big-r{font:400 20px var(--f-d);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line2);text-align:left}
.tw{overflow-x:auto}
#me-xp{font-size:10.5px;color:#d8d2c0;line-height:1.35}
#me-buf{display:flex;gap:4px;flex-wrap:wrap}
#me-buf span{font-size:10px;padding:0 5px;border-radius:3px;background:rgba(217,180,95,.18);border:1px solid rgba(217,180,95,.45);color:var(--gold2)}
#h-hunt{z-index:6;top:calc(246px + env(safe-area-inset-top,0px));width:min(170px,44vw);background:rgba(10,12,18,.72);border:1px solid var(--line);border-radius:5px;font-size:11px}
#h-hunt .hh{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border-bottom:1px solid var(--line2);color:var(--gold2);cursor:pointer}
#h-hunt .hx{font-size:10px;padding:1px 7px;border-radius:3px;border:1px solid var(--line2);background:#1f3a5c;color:#cfe3ff}
#hunt-b{display:grid;gap:2px;padding:5px 7px}
#hunt-b div{display:flex;justify-content:space-between;gap:8px}#hunt-b i{font-style:normal;color:var(--mute)}#hunt-b b{font-weight:500;font-variant-numeric:tabular-nums}
#h-hunt.shut #hunt-b{display:none}
@media(max-height:520px){#hunt-b{display:none}#h-hunt.open #hunt-b{display:grid}}
#h-raid{left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(300px,60vw);text-align:center;font-size:12px;background:rgba(10,12,18,.78);border:1px solid #6a2a2a;border-radius:4px;padding:4px 8px;pointer-events:none!important}#h-raid .bar{height:8px;margin-top:3px}
#h-q{margin-top:4px;padding-top:4px;border-top:1px solid var(--line2);font-size:10.5px;line-height:1.35;display:block!important}
#h-auto{left:50%;top:62%;transform:translateX(-50%);font:400 22px var(--f-d);color:#fff;text-shadow:0 0 12px rgba(120,200,255,.9),0 2px 3px #000;pointer-events:none!important;animation:pulse 1.4s ease-in-out infinite;letter-spacing:.06em}
@keyframes pulse{50%{opacity:.45}}
#h-kill{font:italic 400 30px var(--f-d);color:#fff;text-shadow:0 2px 4px #000,0 0 10px rgba(255,255,255,.35);line-height:1;pointer-events:none!important}
#h-kill small{font-size:15px;color:#e0584f;margin-left:5px}
#rd-z .sz{display:block;color:#5aa8ff;font-style:italic;font-weight:700}
@media(min-width:760px){#ctl{left:50%;right:auto;transform:translateX(-50%);display:flex;align-items:flex-end;gap:14px}.sk{grid-template-columns:repeat(8,52px)}.sk .gb{width:52px;height:52px}#atk{width:80px;height:80px}}
.bar::after{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0));pointer-events:none}
#h-me,#h-hunt,#h-tg{box-shadow:0 0 0 1px #000,inset 0 0 14px rgba(0,0,0,.5);background:linear-gradient(rgba(18,22,32,.82),rgba(8,10,16,.8))}
.gb{box-shadow:0 0 0 2px #000,inset 0 0 10px rgba(0,0,0,.65)}.gb:active{transform:scale(.93)}
#mapcv{width:100%;display:block;border:1px solid var(--line);border-radius:5px;touch-action:none;cursor:crosshair;background:#000}
textarea{font:inherit;color:var(--text);background:#0c0f16;border:1px solid var(--line2);border-radius:4px;padding:9px 10px;width:100%;min-width:0;user-select:text;-webkit-user-select:text}
#zbn{position:fixed;left:50%;top:70px;transform:translateX(-50%);width:min(440px,90vw);height:96px;z-index:4;border:2px solid #d9a032;border-radius:8px;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .5s;box-shadow:0 6px 24px #000a}
#zbn.on{opacity:1}#zbn i{position:absolute;inset:0;background-size:cover;background-position:center 70%}#zbn b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;color:#ffe9a8;text-shadow:0 2px 6px #000,0 0 14px #000;background:linear-gradient(#0000,#0008)}#zbn small{font-size:12px;color:#fff;margin-top:2px}
</style></head><body>

   const l={id:DB.market.seq++,seller:ch.name,ai:false,k:it.k,e:it.e||0,n,price,ts:Date.now()};
   if(st){it.n-=n;if(it.n<=0)ch.inv.splice(ch.inv.indexOf(it),1)}else{ch.inv.splice(ch.inv.indexOf(it),1);if(G.enhU===it.u)G.enhU=null}
   DB.market.list.push(l);G.exU=null;toast('거래소에 등록했습니다');save();break}
  case'ex-buy':{const i=DB.market.list.findIndex(l=>l.id===+D.id);if(i<0){toast('이미 팔린 매물입니다');exList();return}const l=DB.market.list[i],d=ITEMS[l.k];
   if(ch.adena<l.price){toast('아데나가 부족합니다');return}if(!canHold(ch,l.k)){toast('가방이 가득 찼습니다');return}
   ch.adena-=l.price;addTo(ch,l.k,l.n,l.e);DB.market.list.splice(i,1);
   if(!l.ai){const s=charByName(l.seller),got=Math.floor(l.price*(1-MARKET_FEE));if(s){s.adena=(s.adena||0)+got;(s.mail=s.mail||[]).push(`거래소: ${d.name}${l.n>1?' ×'+l.n:''} 판매 완료 (+${fm(got)} 아데나, 수수료 5%)`)}}
   log(`거래소 구매: ${inm({k:l.k,e:l.e})}${l.n>1?' ×'+l.n:''} (-${fm(l.price)})`);toast('구매했습니다');mkSeed();save();
   const keep=['ex-q','ex-slot','ex-grade','ex-sort'].map(id=>$('#'+id).value),fit=$('#ex-fit').checked;renderWin();['ex-q','ex-slot','ex-grade','ex-sort'].forEach((id,k)=>{$('#'+id).value=keep[k]});$('#ex-fit').checked=fit;exList();return}
  case'ex-cancel':{const i=DB.market.list.findIndex(l=>l.id===+D.id&&l.seller===ch.name);if(i<0)break;const l=DB.market.list[i];if(!canHold(ch,l.k)){toast('가방이 가득 찼습니다');break}addTo(ch,l.k,l.n,l.e);DB.market.list.splice(i,1);toast('등록을 취소했습니다');save();break}
  case'gm-give':{if(!isGM())break;const t=tgChar(),n=cl(+$('#gm-n').value||1,1,999),e=cl(+$('#gm-e').value||0,0,15),d=ITEMS[D.k];if(!t)break;
   const a=addTo(t,D.k,n,ENHSLOT[d.slot]?e:0);toast(a?`${t.name}에게 ${d.name} ${a}개 지급`:'가방이 가득 찼습니다');if(t===ch){recalc();log(`[GM] ${inm({k:D.k,e:ENHSLOT[d.slot]?e:0})} ×${a} 생성`)}persist();return}
  case'gm-money':{if(!isGM())break;const t=tgChar();if(!t)break;const ad=Math.trunc(+$('#gm-ad').value||0),di=Math.trunc(+$('#gm-di').value||0);t.adena=Math.max(0,(t.adena||0)+ad);t.dia=Math.max(0,(t.dia||0)+di);toast(`${t.name}: 아데나 ${ad>=0?'+':''}${fm(ad)} · 다이아 ${di>=0?'+':''}${fm(di)}`);persist();return}
  case'gm-lvset':{if(!isGM())break;const t=tgChar();if(!t)break;t.lv=cl(Math.trunc(+$('#gm-lv').value||1),1,LVCAP);t.exp=0;t.st={};t.bp=(t.lv-1)*3;t.stv=1;if(t===ch){recalc();G.P.hp=G.S.hp;G.P.mp=G.S.mp}toast(`${t.name} 레벨 ${t.lv}`);persist();return}
  case'gm-god':G.god=!G.god;toast(G.god?'무적 켜짐':'무적 꺼짐');break;
  case'gm-heal':G.P.hp=G.S.hp;G.P.mp=G.S.mp;G.P.dead=false;$('#dead').hidden=true;toast('전체 회복');return;
  case'gm-boss':{const id=$('#gm-bz').value,bb=G.boss[id];if(!bb.alive){bb.alive=true;announce(`[GM] ${ZBY(id).boss[0]} 소환`);if(G.zone.id===id)G.mons.push(mkBoss(ZBY(id)))}else toast('이미 출현 중입니다');return}
  case'gm-aiset':{G.aiN=cl(Math.trunc(+$('#gm-ai').value||0),0,10);if(!G.zone.safe&&!G.zone.dungeon){G.ais=[];for(let i=0;i<G.aiN;i++)G.ais.push(mkAI(G.zone))}toast(`AI 유저 ${G.aiN}명`);return}
  case'gm-ann':{const m=$('#gm-msg').value.trim();if(m){announce(`[공지] ${esc(m)}`);$('#gm-msg').value=''}return}
  case'gm-role':{const acc=DB.accounts[D.id];if(!acc)break;if(acc.role==='gm'&&Object.values(DB.accounts).filter(x=>x.role==='gm').length<=1){toast('마지막 GM 계정은 해제할 수 없습니다');break}acc.role=acc.role==='gm'?'user':'gm';persist();if(!isGM()){closeWin();toast('GM 권한이 해제되었습니다');return}break}
  case'gm-del':{const acc=DB.accounts[D.id];if(!acc||acc===G.acc)break;if(G.delC!==D.id){G.delC=D.id;break}if(acc.role==='gm'&&Object.values(DB.accounts).filter(x=>x.role==='gm').length<=1){toast('마지막 GM 계정은 삭제할 수 없습니다');break}delete DB.accounts[D.id];G.delC=null;persist();toast('계정을 삭제했습니다');break}
  case'gm-pwset':{const p=$('#gm-pw').value;if(p.length<4){toast('비밀번호는 4자 이상이어야 합니다');return}G.acc.pw=hash(G.acc.id+':'+p);persist();$('#gm-pw').value='';toast('비밀번호를 변경했습니다');return}
  default:if(XACT[a]&&XACT[a](D,ch)===false)return}
 renderWin()});
$('#wx').addEventListener('click',closeWin);
setInterval(()=>{if(G.win==='boss')renderWin()},1000);

$('#win').addEventListener('input',e=>{if(e.target.id==='ex-q')exList()});
$('#win').addEventListener('change',e=>{if(['ex-slot','ex-grade','ex-sort','ex-fit'].includes(e.target.id))exList()});
$('#win').addEventListener('pointerdown',e=>{if(e.target.id==='mapcv'&&G.run&&!G.P.dead){const r=e.target.getBoundingClientRect(),z=G.zone;setDest(cl((e.clientX-r.left)/r.width*z.w,20,z.w-20),cl((e.clientY-r.top)/r.height*z.h,20,z.h-20));closeWin()}});

/* ---------- 에셋 연출: 구역 배너 · 로그인 배경 ---------- */
const BGK={plain:4,forest:2,grave:3,abyss:3,dungeon:3,lava:3,temple:1,town:4,ice:6,snow:5},BGF={lava:'hue-rotate(-35deg) saturate(1.6) brightness(.9)',abyss:'hue-rotate(250deg) saturate(1.2) brightness(.8)',dungeon:'saturate(.8) brightness(.85)'};
let zbT=0;
function zoneBanner(z){const el=$('#zbn');if(!el||!AS.bgu)return;const k=BGK[z.kind]!=null?BGK[z.kind]:0,u=AS.bgu[k];if(!u)return;
 const i=el.querySelector('i');i.style.backgroundImage=`url(${u})`;i.style.filter=BGF[z.kind]||'';
 el.querySelector('b').innerHTML=`${esc(z.name)}<small>${z.safe?'Safety Zone':'권장 Lv.'+(z.lv||1)}</small>`;
 el.classList.add('on');clearTimeout(zbT);zbT=setTimeout(()=>el.classList.remove('on'),3200)}
const _ez=enterZone;enterZone=function(zz){const r=_ez.apply(this,arguments);try{if(G.zone)zoneBanner(G.zone)}catch(e){}return r};
const _ss=showScr;showScr=function(id){_ss(id);if(AS.bgu&&id!=='scr-game'){const b=$('#bgfx');b.style.background=`linear-gradient(#0009,#000c),url(${AS.bgu[AS.bgi==null?(AS.bgi=[0,1,2,4,5][Math.floor(Math.random()*5)]):AS.bgi]||AS.bgu[0]})`}else if(id==='scr-game')$('#zbn').classList.remove('on')};
let _bt=0;(function w(){if(AS.bgu&&AS.bgu[0]&&!G.run){showScr($('#scr-login').hidden?($('#scr-char').hidden?'scr-login':'scr-char'):'scr-login')}else if(++_bt<20&&!G.run)setTimeout(w,300)})();

/* ---------- 로그인·캐릭터 ---------- */
function showScr(id){['scr-login','scr-char','scr-game'].forEach(s=>{$('#'+s).hidden=s!==id});$('#bgfx').style.display=id==='scr-game'?'none':'block'}
let lgMode='in';
function setLg(m){lgMode=m;$$('#lg-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===m));$('#li-pw2w').hidden=m==='in';$('#li-go').textContent=m==='in'?'로그인':'계정 만들기';$('#li-err').textContent='';$('#li-pw').autocomplete=m==='in'?'current-password':'new-password'}
$('#lg-tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setLg(b.dataset.t)});
$('#lg-form').addEventListener('submit',e=>{e.preventDefault();
 const id=$('#li-id').value.trim().toLowerCase(),pw=$('#li-pw').value,err=m=>{$('#li-err').textContent=m};
 if(lgMode==='in'){const a=DB.accounts[id];if(!a||a.pw!==hash(id+':'+pw)){err('아이디 또는 비밀번호가 올바르지 않습니다');return}G.acc=a}
 else{if(!/^[a-z0-9]{4,12}$/.test(id)){err('아이디는 영문·숫자 4~12자로 입력하세요');return}if(DB.accounts[id]){err('이미 사용 중인 아이디입니다');return}
  if(pw.length<4){err('비밀번호는 4자 이상이어야 합니다');return}if(pw!==$('#li-pw2').value){err('비밀번호 확인이 일치하지 않습니다');return}
  DB.accounts[id]={id,pw:hash(id+':'+pw),role:'user',chars:[]};persist();G.acc=DB.accounts[id]}
 $('#li-pw').value=$('#li-pw2').value='';err('');showChars()});
let csSel='knight';
function showChars(){showScr('scr-char');renderChars()}
function renderChars(mode){const a=G.acc,gm=isGM();
 $('#cs-acc').innerHTML=`${esc(a.id)}<span class="badge ${gm?'gm':''}">${gm?'GM 계정':'일반 유저'}</span>`;
 if(mode==='new'){$('#cs-body').innerHTML=`<div class="f"><label for="cn-name">캐릭터 이름 (한글·영문·숫자 2~8자)</label><input id="cn-name" maxlength="8" autocomplete="off"></div>
  <div class="cgrid">${Object.keys(CLS).map(k=>`<button type="button" class="cc ${k===csSel?'on':''}" data-c="${k}"><div><span class="sw" style="background:${CLS[k].col}"></span><b>${CLS[k].n}</b></div><small>${CLS[k].d}</small></button>`).join('')}</div>
  <div class="err" id="cn-err" role="alert"></div><div class="btns" style="justify-content:flex-start"><button class="btn" id="cn-ok" type="button">캐릭터 생성</button><button class="btn sec" id="cn-no" type="button">취소</button></div>`;return}
 const s=[0,1,2].map(i=>{const c=a.chars[i];if(!c)return`<div class="slot"><div class="sw" style="background:#222"></div><div class="m"><b class="mute">빈 슬롯</b></div><button class="btn sm" data-new="1" type="button">새 캐릭터</button></div>`;
  return`<div class="slot"><div class="sw" style="background:${CLS[c.cls].col}"></div><div class="m"><b>${gm?'<span class="gmtag">GM</span>':''}${esc(c.name)}</b><small>Lv.${c.lv} ${CLS[c.cls].n} · ${ZBY(c.zone||'town').name}</small></div><button class="btn sm" data-play="${i}" type="button">접속</button><button class="btn sm red" data-del="${i}" type="button">${csDel===i?'삭제 확인':'삭제'}</button></div>`}).join('');
 $('#cs-body').innerHTML=`<p class="note" style="margin-top:12px">${gm?'게임마스터 계정입니다. 이 계정의 캐릭터는 GM 표식과 GM 도구를 사용합니다.':'일반 유저 계정입니다. 최대 3명의 캐릭터를 만들 수 있습니다.'}</p><div class="slots">${s}</div>`}
let csDel=-1;
$('#cs-out').addEventListener('click',()=>{G.acc=null;showScr('scr-login');setLg('in')});
$('#cs-body').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=G.acc;
 if(b.dataset.new){csDel=-1;renderChars('new');return}
 if(b.dataset.c){csSel=b.dataset.c;const v=$('#cn-name').value;renderChars('new');$('#cn-name').value=v;return}
 if(b.id==='cn-no'){renderChars();return}
 if(b.id==='cn-ok'){const name=$('#cn-name').value.trim(),err=m=>{$('#cn-err').textContent=m};
  if(!/^[가-힣a-zA-Z0-9]{2,8}$/.test(name)){err('이름은 한글·영문·숫자 2~8자로 입력하세요');return}
  if(allChars().some(x=>x.c.name.toLowerCase()===name.toLowerCase())){err('이미 사용 중인 이름입니다');return}
  const c={name,cls:csSel,lv:1,exp:0,hp:0,mp:null,adena:3000,dia:50,inv:[],eq:{},align:0,sk:{},zone:'town',boostUntil:0};
  const cc=CLS[csSel];c.eq.weapon={u:++UID,k:`w_${csSel}_0`,e:0};c.eq.armor={u:++UID,k:`a_${cc.arm}_0`,e:0};
  addTo(c,'p_hp1',20);addTo(c,'p_mp1',10);addTo(c,'x_town',2);a.chars.push(c);persist();renderChars();return}
 if(b.dataset.play!=null){csDel=-1;startGame(a.chars[+b.dataset.play]);return}
 if(b.dataset.del!=null){const i=+b.dataset.del;if(csDel!==i){csDel=i;renderChars();return}const dc=a.chars[i];guildDrop(dc);DB.market.list=DB.market.list.filter(l=>l.seller!==dc.name);a.chars.splice(i,1);csDel=-1;persist();renderChars()}});
$('#cs-body').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cn-name')$('#cn-ok').click()});

/* ---------- 시작 ---------- */
persist();showScr('scr-login');setLg('in');requestAnimationFrame(frame);
})();
